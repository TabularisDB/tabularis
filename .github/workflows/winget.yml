name: Publish to Winget

on:
  release:
    types: [published]

jobs:
  winget-publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Submit to Winget
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: Debba.Tabularis
          installers-regex: '_winget_x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
