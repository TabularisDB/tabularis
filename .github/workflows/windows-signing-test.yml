name: Windows SignPath test

on:
  workflow_dispatch:
  # Bootstrap this workflow before it exists on the default branch.
  push:
    branches: [ci/signpath-windows-test]
    paths:
      - .github/workflows/windows-signing-test.yml
      - scripts/signpath/**
      - .signpath/**

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-signpath-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-and-verify:
    if: >-
      github.repository == 'TabularisDB/tabularis' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/signpath-windows-test')
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_SIGNER_SHA256: B5211DE719485064179CCA58EE452E59FF1404BCC9902C3D295B0AD77FCB7B0F
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check test signing configuration
        env:
          SIGNPATH_TOKEN_PRESENT: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          UPDATER_KEY_PRESENT: ${{ secrets.TAURI_PRIVATE_KEY != '' }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_WINDOWS_APP_CONFIG_SLUG: ${{ vars.SIGNPATH_WINDOWS_APP_CONFIG_SLUG }}
          SIGNPATH_WINDOWS_INSTALLERS_CONFIG_SLUG: ${{ vars.SIGNPATH_WINDOWS_INSTALLERS_CONFIG_SLUG }}
        run: |
          if ($env:SIGNPATH_TOKEN_PRESENT -ne 'true' -or $env:UPDATER_KEY_PRESENT -ne 'true') {
            throw 'SIGNPATH_API_TOKEN and TAURI_PRIVATE_KEY must be configured'
          }
          foreach ($name in @('SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_WINDOWS_APP_CONFIG_SLUG', 'SIGNPATH_WINDOWS_INSTALLERS_CONFIG_SLUG')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing variable: $name" }
          }
          # Disable automatic updater signing; final signed bytes are signed later.
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content "$env:RUNNER_TEMP/signpath-tauri.json"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: windows-signpath-test
      - run: pnpm install --frozen-lockfile

      - name: Trust the pinned test certificate on this disposable runner
        timeout-minutes: 2
        run: |
          $pem = (Get-Content .signpath/test-certificate.pem -Raw) -replace '-----[^-]+-----|\s', ''
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new([Convert]::FromBase64String($pem))
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($certificate.RawData))
          if ($hash -cne $env:EXPECTED_SIGNER_SHA256) { throw 'Test certificate fingerprint mismatch' }
          "TEST_CERT_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/signpath-test.cer", $certificate.RawData)
          # CurrentUser\Root imports can open a Security Warning dialog and hang
          # a headless runner. The hosted runner is elevated: use the machine
          # store through certutil in force/non-interactive mode instead.
          Write-Output "Installing pinned test certificate $hash in LocalMachine\Root"
          certutil.exe -f -addstore Root "$env:RUNNER_TEMP/signpath-test.cer"
          if ($LASTEXITCODE -ne 0) { throw 'Test certificate installation failed' }
          if (-not (Test-Path "Cert:\LocalMachine\Root\$($certificate.Thumbprint)")) {
            throw 'Test certificate is missing from the machine root store'
          }
          Write-Output 'Pinned test certificate installed'

      - name: Build Windows application without bundles
        # CLI 2.11.4 patches binaries during bundling and invalidates prior signatures.
        # Use a pinned test-only CLI with --no-binary-patching; do not upgrade releases yet.
        run: pnpm --package=@tauri-apps/cli@2.12.4 dlx tauri build --ci --no-bundle --config "$env:RUNNER_TEMP/signpath-tauri.json" -- --locked

      - name: Upload unsigned application
        id: unsigned-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-unsigned-app-${{ github.run_attempt }}
          path: src-tauri/target/release/tabularis.exe
          if-no-files-found: error
          retention-days: 2

      - name: Test-sign application
        id: sign-app
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: test-signing
          artifact-configuration-slug: ${{ vars.SIGNPATH_WINDOWS_APP_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      - name: Verify and restore the signed application
        id: signed-app
        run: |
          $files = @(Get-ChildItem signed-app -Recurse -File -Force)
          if ($files.Count -ne 1 -or $files[0].Name -cne 'tabularis.exe') {
            throw 'SignPath must return exactly one tabularis.exe'
          }
          ./scripts/signpath/verify-authenticode.ps1 -Paths $files[0].FullName -ExpectedSignerSha256 $env:EXPECTED_SIGNER_SHA256
          Copy-Item $files[0].FullName src-tauri/target/release/tabularis.exe -Force
          "sha256=$((Get-FileHash src-tauri/target/release/tabularis.exe).Hash)" >> $env:GITHUB_OUTPUT

      - name: Bundle signed application into MSI and NSIS
        run: pnpm --package=@tauri-apps/cli@2.12.4 dlx tauri bundle --ci --bundles msi,nsis --no-binary-patching --config "$env:RUNNER_TEMP/signpath-tauri.json"

      - name: Stage unsigned installers
        run: |
          New-Item -ItemType Directory unsigned-installers | Out-Null
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi -File -Filter *.msi)
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter *-setup.exe)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) { throw 'Expected exactly one MSI and one NSIS installer' }
          Copy-Item $msi[0].FullName unsigned-installers
          Copy-Item $nsis[0].FullName unsigned-installers

      - name: Upload unsigned installers
        id: unsigned-installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-unsigned-installers-${{ github.run_attempt }}
          path: unsigned-installers/*
          if-no-files-found: error
          retention-days: 2

      - name: Test-sign installers
        id: sign-installers
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: test-signing
          artifact-configuration-slug: ${{ vars.SIGNPATH_WINDOWS_INSTALLERS_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers

      - name: Verify installer signatures and embedded applications
        timeout-minutes: 10
        run: ./scripts/signpath/verify-test-installers.ps1 -SignedDirectory signed-installers -ExpectedSignerSha256 $env:EXPECTED_SIGNER_SHA256

      - name: Sign final updater files and verify portable archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APP_SIGNING_REQUEST: ${{ steps.sign-app.outputs.signing-request-web-url }}
          INSTALLER_SIGNING_REQUEST: ${{ steps.sign-installers.outputs.signing-request-web-url }}
          SIGNED_APP_SHA256: ${{ steps.signed-app.outputs.sha256 }}
        run: ./scripts/signpath/finalize-test-artifacts.ps1 -SignedDirectory signed-installers -ExpectedSignerSha256 $env:EXPECTED_SIGNER_SHA256 -SignedAppSha256 $env:SIGNED_APP_SHA256

      - name: Upload verified test artifacts (never publish a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabularis-signpath-TEST-ONLY-${{ github.run_id }}-${{ github.run_attempt }}
          path: signpath-results/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary certificate trust
        if: always() && env.TEST_CERT_THUMBPRINT != ''
        timeout-minutes: 2
        run: Remove-Item "Cert:\LocalMachine\Root\$env:TEST_CERT_THUMBPRINT" -ErrorAction SilentlyContinue
