name: Design & Accessibility

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packages/*/src/**'
      - 'tests/utils/themeContrast.test.ts'
      - 'scripts/check-theme-tokens.mjs'
      - 'eslint.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'packages/*/src/**'
      - 'tests/utils/themeContrast.test.ts'
      - 'scripts/check-theme-tokens.mjs'
      - 'eslint.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

jobs:
  design-tokens:
    name: Theme tokens
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Dependency-free script: colors, radii and fonts must come from theme tokens (DESIGN.md).
      - name: Check theme token usage
        run: node scripts/check-theme-tokens.mjs --github

  theme-contrast:
    name: Theme contrast (WCAG AA)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check built-in theme contrast
        run: pnpm run test:contrast

  a11y-lint:
    name: ESLint with jsx-a11y
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # setup-node registers the ESLint problem matcher, so findings are annotated on the diff.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (includes jsx-a11y recommended rules)
        run: pnpm exec eslint .
