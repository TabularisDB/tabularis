name: Release

# Thin dispatcher over the reusable build matrix in build.yml — the single
# place that defines platforms, signing and AppImage handling for every
# channel (release + nightly), so the two can't drift apart again (the
# v0.13.3 AppImage regression, issue #423, came from exactly that drift).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build (from any fork). Builds from refs/pull/<N>/head and is ALWAYS marked as prerelease so it bypasses AUR/Snap/Winget."
        required: false
      tag_name:
        description: "Tag/release name (e.g. v0.10.0-json-beta.1). Required when pr_number is set."
        required: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      body: ${{ steps.body.outputs.body }}
    steps:
      - name: Resolve build ref + tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "ref=refs/pull/${{ inputs.pr_number }}/head" >> "$GITHUB_OUTPUT"
            if [ -z "${{ inputs.tag_name }}" ]; then
              echo "::error::tag_name is required when pr_number is provided"
              exit 1
            fi
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
            # Fork PR builds are ALWAYS prerelease — release bits must come from main, not a fork.
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag_name || github.ref_name }}" >> "$GITHUB_OUTPUT"
            # Auto-flag prerelease when tag contains a "-" suffix (semver pre-release).
            if [[ "${{ inputs.tag_name || github.ref_name }}" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # The changelog mapping lives on the tagged commit, not on PR heads,
      # so always read it from the ref that triggered the workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Prepend the announcement blog post (from packages/web-ui/src/data/changelog.ts) to the
      # release body when one exists for this version. GitHub's auto-generated
      # "What's Changed" section is appended after the body, so the link always
      # shows up above it.
      - name: Compose release body
        id: body
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          blog_url="$(node -e '
            const fs = require("fs");
            const src = fs.readFileSync("packages/web-ui/src/data/changelog.ts", "utf8");
            const version = process.argv[1];
            const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const m = src.match(new RegExp(`"${escaped}":\\s*"([^"]+)"`));
            if (m) process.stdout.write(m[1]);
          ' "$version")"
          {
            echo "body<<RELEASE_BODY_EOF"
            if [ -n "$blog_url" ]; then
              echo "📖 **Read the announcement blog post:** ${blog_url}?utm_src=github-release"
              echo ""
            fi
            echo "See the assets below to download this version and install."
            echo ""
            echo "---"
            echo "**Stay in touch:** [Website](https://tabularis.dev) · [Discord](https://discord.com/invite/K2hmhfHRSt) · [X](https://x.com/tabularisdb) · [Bluesky](https://bsky.app/profile/tabularis.bsky.social) · [Mastodon](https://mastodon.social/@tabularis) · [GitHub](https://github.com/TabularisDB/tabularis)"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: meta
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: ${{ needs.meta.outputs.ref }}
      tag: ${{ needs.meta.outputs.tag }}
      release_name: "v__VERSION__"
      release_body: ${{ needs.meta.outputs.body }}
      draft: true
      prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
