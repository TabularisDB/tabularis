name: Release packages

# Opens one release PR per npm package under packages/* that has releasable
# commits since its last release, using the Conventional Commit titles that
# land on main (squash merges): `fix` bumps the patch, `feat` the minor, and
# while a package is below 1.0.0 a breaking change also bumps the minor.
# `chore`, `ci`, `docs`, `test`, ... never trigger a release. Packages without
# changes are left alone.
#
# Merging a release PR bumps "version" in that package.json and updates its
# CHANGELOG.md; npm-publish.yml then sees the unpublished version and pushes
# it to npm. This workflow never publishes anything itself.
#
# Config: release-please-config.json and .release-please-manifest.json at the
# repo root. GitHub releases are created as prereleases with component tags
# (create-plugin-v0.4.3, ...), so they never become the app's "latest"
# release, which the stable updater reads, and the release-triggered
# distribution workflows (aur, winget, snap, flatpak) skip them. The nightly
# updater only considers `nightly-*` tags.
#
# Requires "Allow GitHub Actions to create and approve pull requests" in the
# repository Actions settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PRs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
