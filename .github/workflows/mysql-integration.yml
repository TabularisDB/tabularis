name: Integration Tests (MySQL)

concurrency:
  group: mysql-integration-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/mysql-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/mysql-integration.yml'
  workflow_dispatch:

jobs:
  test-mysql:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Both images ship TLS enabled with auto-generated certificates,
        # which the foreign-key fixture requires. 5.7 is the server the
        # information_schema pruning matters most on.
        image: ['mysql:8.4', 'mysql:5.7-debian']

    services:
      mysql:
        image: ${{ matrix.image }}
        ports:
          - 33060:3306
        env:
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-mysql-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mysql-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Run MySQL integration tests
        working-directory: src-tauri
        env:
          RUST_TEST_THREADS: "1"
          TABULARIS_TEST_MYSQL: "1"
          TABULARIS_TEST_MYSQL_HOST: 127.0.0.1
          TABULARIS_TEST_MYSQL_PORT: "33060"
          TABULARIS_TEST_MYSQL_USER: root
          TABULARIS_TEST_MYSQL_PASSWORD: password
        run: cargo test --test mysql_foreign_keys -- --include-ignored
