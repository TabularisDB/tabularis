name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'packages/web-ui/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'packages/explain/**' # imported from source by the host
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.js'
      - 'docs/web/**'
      - 'docs/architecture/decisions/**'
      - 'e2e/web/**'
      - 'scripts/web/**'
      - 'tests/web/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/web-ui/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'packages/explain/**' # imported from source by the host
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.js'
      - 'docs/web/**'
      - 'docs/architecture/decisions/**'
      - 'e2e/web/**'
      - 'scripts/web/**'
      - 'tests/web/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm

      - name: Install Rust/Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check web frontend boundaries
        run: pnpm run web:boundaries

      - name: Check Web UI packaging contract
        run: pnpm run web:packaging

      - name: Check Web UI documentation
        run: pnpm run web:docs

      - name: Check signed Web UI parity audit
        run: pnpm run web:manual-parity

      - name: Build
        run: pnpm run build

      - name: Check dual-transport contract
        run: pnpm run test:web-contract

      - name: Check Web UI resilience
        run: pnpm run test:web-resilience

      - name: Test
        run: pnpm run test:all

      # The container image builds the server without Tauri.
      - name: Check the server-only build
        working-directory: src-tauri
        run: cargo check --locked --no-default-features --bin tabularis

      - name: Keep Tauri inside the desktop transport
        run: |
          if grep -rnE '(^|[^_[:alnum:]])tauri(::|_plugin)' src-tauri/src --include='*.rs' \
            --exclude-dir=desktop | grep -v 'tauri::mobile_entry_point\|async_runtime\|tauri::test::'; then
            echo "::error::Tauri code belongs in src-tauri/src/transport/desktop/ (see .rules/rust.md)"
            exit 1
          fi

  web-e2e:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tabularis-e2e
          POSTGRES_DB: tabularis_e2e
        ports:
          - 45432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tabularis_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tabularis-e2e
          MYSQL_DATABASE: tabularis_e2e
        ports:
          - 43306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptabularis-e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm

      - name: Install Rust/Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run real-database browser matrix
        env:
          TABULARIS_E2E_MANAGED_DATABASES: "1"
        run: pnpm test:web-e2e:browsers

      - name: Upload browser E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-artifacts
          path: e2e/web/.runtime
          if-no-files-found: ignore
