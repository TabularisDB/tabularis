name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feat/web-ui]
    paths:
      - 'packages/web-ui/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.js'
      - 'web-ui-project/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, feat/web-ui]
    paths:
      - 'packages/web-ui/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.js'
      - 'web-ui-project/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm

      - name: Install Rust/Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check web API inventory
        run: pnpm run web:inventory

      - name: Check web frontend boundaries
        run: pnpm run web:boundaries

      - name: Check Web UI packaging contract
        run: pnpm run web:packaging

      - name: Build
        run: pnpm run build

      - name: Check dual-transport contract
        run: pnpm run test:web-contract

      - name: Test
        run: pnpm run test:all
