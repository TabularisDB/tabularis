name: Build

# Reusable build matrix used by nightly.yml (cron), release.yml (tags) and
# preview.yml (maintainer-requested PR builds). Centralises the
# signing/notarization config in one place so callers can't drift from it.
#
# Two modes:
#   * release (default): signed + notarized bundles uploaded as assets of the
#     GitHub Release `tag`, created if missing.
#   * preview: `preview: true`. Bundles uploaded as workflow-run artifacts
#     only: no release, no tag, no updater artifacts. Signed + notarized when
#     the signing secrets are available, unsigned (with a warning) when they
#     are not. That is what makes the fork rule work: on a `pull_request`
#     event GitHub hands secrets only to PRs from this repository, so preview
#     builds of fork PRs come out unsigned without any extra logic here.
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (branch, tag or SHA)."
        required: true
        type: string
      tag:
        description: "Release tag to create/upload to. Ignored (and may be empty) when `preview` is true."
        required: false
        default: ""
        type: string
      preview:
        description: "Upload the bundles as run artifacts instead of a GitHub Release."
        required: false
        default: false
        type: boolean
      release_name:
        description: "Release title. Supports tauri-action's __VERSION__ placeholder."
        required: false
        default: "v__VERSION__"
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease."
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the GitHub Release as a draft."
        required: false
        default: false
        type: boolean
      updater_version:
        description: "Override the app version baked into the build + latest.json (nightly uses a prerelease semver). Empty = leave as-is."
        required: false
        type: string
        default: ""
      release_body:
        description: "Body of the GitHub Release."
        required: false
        type: string
        default: "See the assets to download this version and install."
      experimental_appimage:
        description: "Build the AppImage with the experimental sharun-based format (tauri PR #12491) instead of the official linuxdeploy bundler. Nightly-only until the PR stabilises."
        required: false
        type: boolean
        default: false

jobs:
  publish-tauri:
    # Permissions are inherited from the caller: release/nightly grant
    # `contents: write` (release upload), preview grants only `contents: read`.
    # A called workflow can't request more than the caller grants, so they
    # can't be declared here without breaking one of the two modes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm64
            args: "--target aarch64-apple-darwin"
            artifact: macos-arm64
          - platform: "macos-15-intel" # for Intel
            args: "--target x86_64-apple-darwin"
            artifact: macos-x64
          - platform: "ubuntu-24.04"
            args: ""
            artifact: linux-x64
            # Build inside an ubuntu:22.04 container (glibc 2.35) rather than
            # on the bare ubuntu-24.04 runner (glibc 2.39), so the produced
            # .deb/.AppImage keep running on older LTS distros. Pinned to the
            # container image, not the runner, so it's unaffected by GitHub's
            # eventual deprecation of the ubuntu-22.04 *runner* image.
            container: "ubuntu:22.04"
          - platform: "windows-latest"
            args: ""
            artifact: windows-x64

    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}
    steps:
      # The bare ubuntu:22.04 image ships neither git nor curl, which checkout
      # and later steps need. libatomic1 is required by the standalone pnpm
      # binary (@pnpm/exe), which pnpm/action-setup bootstraps here because it
      # runs before setup-node and finds no Node in the container.
      # Runs only inside the container.
      - name: Install container prerequisites (ubuntu container only)
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl libatomic1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # The exact commit being built, for the release tag below. Without it
      # tauri-action tags `github.sha`, which on a scheduled run is main's tip
      # at that moment, not the (possibly older) validated commit we build.
      - name: Resolve built commit
        id: built
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-bad \
            fonts-noto-color-emoji \
            pkg-config \
            unzip

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Override tauri-cli with custom AppImage format (Linux, experimental only)
        if: matrix.platform == 'ubuntu-24.04' && inputs.experimental_appimage
        # Pinned rev + --locked: an unpinned branch install resolves fresh
        # dependency versions and broke when value-bag 1.14 dropped APIs that
        # log 0.4.34 still uses.
        run: cargo install tauri-cli --git https://github.com/tauri-apps/tauri --rev 503bdbc1eade37d50a64ea7f81dbe853338b7fda --locked --force

      # The official tauri-cli AppImage bundler (linuxdeploy) bundles the build
      # container's libwayland-*; on hosts with a newer Mesa the host libEGL
      # binds to that stale bundled libwayland-client and WebKit aborts with
      # EGL_BAD_PARAMETER (issue #423). libwayland must always come from the
      # host — the AppImage excludelist prescribes exactly that:
      # https://github.com/AppImageCommunity/pkg2appimage/pull/559
      # tauri-bundler only downloads linuxdeploy-plugin-gtk.sh when it's
      # missing from its tools cache, so pre-seed a patched copy that strips
      # libwayland from the AppDir before the squashfs is packed (the updater
      # signature is computed afterwards, so it stays valid).
      - name: Patch AppImage bundling to strip bundled libwayland (Linux)
        if: matrix.platform == 'ubuntu-24.04' && !inputs.experimental_appimage
        run: |
          mkdir -p ~/.cache/tauri
          curl -fsSL https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh \
            -o ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          cat >> ~/.cache/tauri/linuxdeploy-plugin-gtk.sh <<'EOF'

          # tabularis #423: libwayland must come from the host, never bundled.
          find "$APPDIR" -name 'libwayland-*.so*' -delete
          EOF
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

      # Signing/notarization needs the whole set; a partial set would make
      # tauri fail half-way, and a set-but-empty APPLE_SIGNING_IDENTITY is
      # taken by tauri as an identity to sign with. Hence the two build steps
      # below: the signed one defines the variables, the unsigned one doesn't.
      - name: Detect signing secrets
        shell: bash
        env:
          HAS_SECRETS: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_KEY_CONTENT != '' && secrets.TAURI_PRIVATE_KEY != '' }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          echo "CAN_SIGN=$HAS_SECRETS" >> "$GITHUB_ENV"
          if [ "$HAS_SECRETS" != "true" ]; then
            if [ "$PREVIEW" = "true" ]; then
              echo "::warning::Signing secrets unavailable (fork PR?) — this preview bundle will NOT be signed nor notarized."
            else
              echo "::error::Release builds require the signing secrets; refusing to publish unsigned bundles."
              exit 1
            fi
          fi

      # Notarization needs the App Store Connect API key on disk. The .p8 is stored
      # base64-encoded in APPLE_API_KEY_CONTENT and decoded into a temp file (macOS only).
      - name: Prepare Apple API key (macOS only)
        if: startsWith(matrix.platform, 'macos') && env.CAN_SIGN == 'true'
        shell: bash
        run: |
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      # Preview builds are never served through latest.json, so the updater
      # bundles + .sig files would only be noise; and `createUpdaterArtifacts`
      # makes `tauri build` demand the updater key, which fork PRs don't have.
      - name: Disable updater artifacts (preview)
        if: inputs.preview
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);const fs=require('fs');c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f, JSON.stringify(c, null, 2)+'\n');"

      - name: Override app version (nightly channel)
        if: inputs.updater_version != ''
        shell: bash
        run: |
          set -euo pipefail
          v='${{ inputs.updater_version }}'
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);const fs=require('fs');c.version=process.argv[1];fs.writeFileSync(f, JSON.stringify(c, null, 2)+'\n');" "$v"
          # First version key in Cargo.toml is the [package] version.
          # sed -i.bak keeps it portable across GNU and macOS BSD sed.
          sed -i.bak "0,/^version = \".*\"/s//version = \"$v\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
          # The frontend does not read tauri.conf.json: the About page, the
          # Updates card and plugin compatibility checks all use the constant
          # in packages/web-ui/src/version.ts (kept in sync by scripts/sync-version.js on
          # release). Patch it too, or a nightly shows the stable version it
          # was branched from instead of its own.
          printf 'export const APP_VERSION = "%s";\n' "$v" > packages/web-ui/src/version.ts
          echo "Patched version to $v"

      - name: Build signed bundles (+ upload to GitHub Release unless preview)
        if: env.CAN_SIGN == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: ${{ inputs.experimental_appimage && 'true' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # macOS code signing (Developer ID Application certificate)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # macOS notarization (App Store Connect API key)
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          # Without a tagName tauri-action only builds and never touches
          # releases, which is exactly what preview mode wants.
          tagName: ${{ !inputs.preview && inputs.tag || '' }}
          # Tag the commit we actually built (unused when the tag already exists).
          releaseCommitish: ${{ steps.built.outputs.sha }}
          releaseName: ${{ inputs.release_name }}
          releaseBody: ${{ inputs.release_body }}
          releaseDraft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          # The experimental AppImage format needs the cargo-installed CLI override.
          tauriScript: ${{ inputs.experimental_appimage && matrix.platform == 'ubuntu-24.04' && 'cargo tauri' || 'pnpm tauri' }}
          args: ${{ matrix.args }}

      - name: Build unsigned bundles (preview without secrets)
        if: env.CAN_SIGN != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: ${{ inputs.experimental_appimage && 'true' || '' }}
        with:
          # No tagName: tauri-action only builds, it never touches releases.
          tauriScript: ${{ inputs.experimental_appimage && matrix.platform == 'ubuntu-24.04' && 'cargo tauri' || 'pnpm tauri' }}
          args: ${{ matrix.args }}

      - name: Verify packaged Web UI (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find src-tauri/target -path '*/bundle/deb/*.deb' -print -quit)
          appimage=$(find src-tauri/target -path '*/bundle/appimage/*.AppImage' -print -quit)
          test -n "$deb"
          test -n "$appimage"
          web-ui-project/scripts/verify-linux-web-package.sh assets "$deb"
          web-ui-project/scripts/verify-linux-web-package.sh assets "$appimage"

      - name: Smoke-test headless Web mode (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find src-tauri/target -path '*/bundle/deb/*.deb' -print -quit)
          test -n "$deb"
          web-ui-project/scripts/verify-linux-web-package.sh headless "$deb"

      - name: Verify packaged Web UI (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          app=$(find src-tauri/target -path '*/bundle/macos/*.app' -type d -print -quit)
          test -n "$app"
          web_root="$app/Contents/Resources/web-ui"
          test -f "$web_root/index.html"
          test -n "$(find "$web_root/assets" -type f -print -quit)"
          cmp packages/web-ui/dist/index.html "$web_root/index.html"

      - name: Verify packaged Web UI (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri\target -Recurse -File -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "No MSI artifact was produced" }

          $extract = Join-Path $env:RUNNER_TEMP "tabularis-msi-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $extract | Out-Null
          $msiExtraction = Start-Process msiexec.exe -ArgumentList "/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$extract`"" -Wait -PassThru
          if ($msiExtraction.ExitCode -ne 0) {
            throw "MSI extraction failed with exit code $($msiExtraction.ExitCode)"
          }

          $index = Get-ChildItem $extract -Recurse -File -Filter index.html |
            Where-Object { $_.FullName -match '[\\/]web-ui[\\/]index\.html$' } |
            Select-Object -First 1
          if (-not $index) { throw "The MSI does not contain web-ui/index.html" }
          $assets = Join-Path $index.DirectoryName "assets"
          if (-not (Get-ChildItem $assets -Recurse -File | Select-Object -First 1)) {
            throw "The MSI does not contain Web UI assets"
          }
          if ((Get-FileHash packages\web-ui\dist\index.html).Hash -ne (Get-FileHash $index.FullName).Hash) {
            throw "The MSI Web UI index differs from the built distribution"
          }
          Remove-Item $extract -Recurse -Force

      - name: Package and upload portable Web UI bundle (Windows only)
        if: matrix.platform == 'windows-latest' && !inputs.preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.tag }}".TrimStart('v')
          $portableRoot = "tabularis_${version}_x64-portable"
          $portable = "tabularis_${version}_x64-portable.zip"
          New-Item -ItemType Directory -Path $portableRoot | Out-Null
          Copy-Item src-tauri\target\release\tabularis.exe (Join-Path $portableRoot "tabularis.exe")
          Copy-Item packages\web-ui\dist (Join-Path $portableRoot "web-ui") -Recurse
          Compress-Archive -Path "$portableRoot\*" -DestinationPath $portable

          $verify = Join-Path $env:RUNNER_TEMP "tabularis-portable-$([guid]::NewGuid())"
          Expand-Archive $portable -DestinationPath $verify
          if (-not (Test-Path (Join-Path $verify "tabularis.exe"))) { throw "Portable executable is missing" }
          if (-not (Test-Path (Join-Path $verify "web-ui\index.html"))) { throw "Portable Web UI is missing" }
          Remove-Item $verify -Recurse -Force

          gh release upload "${{ inputs.tag }}" $portable --clobber

      # Same layout as the release portable bundle: the executable serves the
      # Web UI from the sibling web-ui/ directory.
      - name: Stage portable Web UI bundle (Windows only, preview mode)
        if: matrix.platform == 'windows-latest' && inputs.preview
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $portableRoot = Join-Path $env:RUNNER_TEMP "tabularis_${version}_x64-portable"
          New-Item -ItemType Directory -Path $portableRoot | Out-Null
          Copy-Item src-tauri\target\release\tabularis.exe (Join-Path $portableRoot "tabularis.exe")
          Copy-Item packages\web-ui\dist (Join-Path $portableRoot "web-ui") -Recurse
          Compress-Archive -Path "$portableRoot\*" -DestinationPath "src-tauri\target\release\bundle\tabularis_${version}_x64-portable.zip"

      # Only the installable bundles: the raw .app directory, the deb/rpm
      # staging trees and the binaries themselves are noise for a tester.
      - name: Upload preview artifacts
        if: inputs.preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabularis-preview-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*-portable.zip
          if-no-files-found: error
          retention-days: 14
