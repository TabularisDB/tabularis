  <!-- SQL content -->
  <text x="68" y="80" font-size="11" fill="#565f89">-- Migration: staging.users → production.users</text>
  <text x="68" y="98" font-size="11" fill="#565f89">-- Generated: 2026-07-24 14:30:00</text>
  <text x="68" y="116" font-size="11" fill="#c0caf5"> </text>
  <text x="68" y="134" font-size="11" fill="#565f89">-- Add new columns</text>
  <text x="68" y="152" font-size="11" fill="#c0caf5"><tspan fill="#7aa2f7">ALTER TABLE</tspan> users <tspan fill="#7aa2f7">ADD COLUMN</tspan> avatar_url <tspan fill="#bb9af7">VARCHAR</tspan>(<tspan fill="#ff9e64">512</tspan>) <tspan fill="#7aa2f7">NULL</tspan>;</text>
  <text x="68" y="170" font-size="11" fill="#c0caf5"><tspan fill="#7aa2f7">ALTER TABLE</tspan> users <tspan fill="#7aa2f7">ADD COLUMN</tspan> last_login_at <tspan fill="#bb9af7">TIMESTAMP</tspan> <tspan fill="#7aa2f7">NULL</tspan>;</text>
  <text x="68" y="188" font-size="11" fill="#c0caf5"> </text>
  <text x="68" y="206" font-size="11" fill="#565f89">-- Modify columns</text>
  <text x="68" y="224" font-size="11" fill="#c0caf5"><tspan fill="#7aa2f7">ALTER TABLE</tspan> users <tspan fill="#7aa2f7">ALTER COLUMN</tspan> email <tspan fill="#7aa2f7">TYPE</tspan> <tspan fill="#bb9af7">VARCHAR</tspan>(<tspan fill="#ff9e64">320</tspan>);</text>
  <text x="68" y="242" font-size="11" fill="#c0caf5"><tspan fill="#7aa2f7">ALTER TABLE</tspan> users <tspan fill="#7aa2f7">ALTER COLUMN</tspan> status <tspan fill="#7aa2f7">DROP NOT NULL</tspan>;</text>
  <text x="68" y="260" font-size="11" fill="#c0caf5"> </text>
  <text x="68" y="278" font-size="11" fill="#565f89">-- Remove deprecated columns</text>
  <text x="68" y="296" font-size="11" fill="#c0caf5"><tspan fill="#7aa2f7">ALTER TABLE</tspan> users <tspan fill="#7aa2f7">DROP COLUMN</tspan> legacy_id;</text>
  <text x="68" y="314" font-size="11" fill="#c0caf5"> </text>
  <text x="68" y="332" font-size="11" fill="#565f89">-- Add indexes</text>

