{{- /* Only values set in the chart go here. The container generates a missing
password or secret-store key on the data volume, so rendering stays the same
under `helm template` (Argo CD, Flux) and never rotates a key. */}}
{{- if and (not .Values.auth.existingSecret) (include "tabularis.chartSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tabularis.fullname" . }}
  labels:
    {{- include "tabularis.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.auth.password }}
  web-password: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.proxySecret }}
  proxy-secret: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secretStore.key }}
  secret-key: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
