# -- External URL the browser uses, e.g. https://tabularis.example.com.
# Required. Must be HTTPS unless it is a localhost URL (port-forwarding).
publicUrl: ''

# -- Extra origins allowed to call the API (the public URL is always allowed).
allowedOrigins: []

# -- Proxy source networks allowed to supply X-Forwarded-For, in CIDR notation.
# Empty means headers are ignored. Restrict to your actual reverse proxies.
trustedProxies: []

image:
  repository: ghcr.io/tabularisdb/tabularis
  # -- Defaults to the chart appVersion.
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []

auth:
  # -- password: built-in login page. proxy: an authenticating reverse proxy
  # sends the shared secret in `x-tabularis-proxy-secret`.
  mode: password
  # -- Secret with the keys `web-password` (password mode) or `proxy-secret`
  # (proxy mode), and `secret-key`. Overrides the three values below.
  existingSecret: ''
  # -- Login password (min. 12 characters). When empty, the container generates
  # one on the data volume (`/data/web-password`) and prints it in its log.
  password: ''
  # -- Proxy secret (min. 32 characters). Required in proxy mode, because the
  # proxy must send the same value.
  proxySecret: ''

secretStore:
  # -- Encrypts saved connection credentials on the volume (min. 16
  # characters). When empty, the container generates `/data/secrets.key` next
  # to the data; set it to keep the key out of volume backups. Losing it makes
  # the saved credentials unreadable.
  key: ''

# -- Grants every session host-level operations (plugin management, server
# file access). Only for a single trusted user.
allowHighRisk: false

# -- Server directories the browser may pick files from.
serverFileBrowserRoots: []

# -- Additional environment variables for the container.
extraEnv: []

persistence:
  enabled: true
  existingClaim: ''
  storageClass: ''
  accessModes:
    - ReadWriteOnce
  size: 2Gi

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ''
  annotations: {}
  # -- The host is taken from publicUrl.
  tls:
    enabled: true
    # -- Defaults to <release>-tls.
    secretName: ''

resources: {}
#  requests:
#    cpu: 100m
#    memory: 256Mi
#  limits:
#    memory: 1Gi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
