<!doctype html>
<!-- spellcheck="false" sets the inherited default for the whole document (WKWebView/macOS
     text helpers). Natural-language prose fields opt back in with spellCheck={true}. -->
<html lang="en" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabularis</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        background: var(--bg-base, #020617);
        color: var(--text-primary, #f8fafc);
      }
    </style>
    <!-- Paint the last applied theme before React mounts (see src/utils/themeBoot.ts),
         so light themes do not flash the dark default on startup. -->
    <script>
      try {
        var boot = JSON.parse(localStorage.getItem("tabularis-theme-boot") || "null");
        if (boot && typeof boot.bg === "string" && typeof boot.fg === "string") {
          var root = document.documentElement;
          root.style.setProperty("--bg-base", boot.bg);
          root.style.setProperty("--text-primary", boot.fg);
          if (boot.scheme === "light" || boot.scheme === "dark") {
            root.style.setProperty("color-scheme", boot.scheme);
          }
        }
      } catch (e) {
        /* storage unavailable: keep the built-in dark default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
